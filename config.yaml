# Configuration for the daily events recommender.
# Nothing secret goes here — the Ticketmaster API key is supplied via the
# TICKETMASTER_API_KEY environment variable (a GitHub Actions secret in CI).

location:
  # City name as recognized by Ticketmaster, e.g. "Denver", "Austin".
  city: "Denver"
  country_code: "US"
  # Search radius around the city.
  radius: 50
  unit: "miles"

# How many days ahead to look for events on each run.
lookahead_days: 30

# Maximum number of newly-recommended events written to the sheet per day.
max_daily_recommendations: 25

# An event's learned score must be at least this to be recommended.
# Lower this to see more events (including ones you haven't reacted to yet);
# raise it once the model has learned your tastes to tighten the list.
min_score_threshold: 0.35

# How aggressively feedback updates the preference model each run.
# 0.05 = slow/steady learning, 0.3 = fast/aggressive learning.
learning_rate: 0.15

# Categories to consider. Set to false to stop recommending a category
# entirely regardless of learned score.
categories:
  Concert: true
  Art: true
  Cultural: true
  Fair: true
  Comedy: true
  "Brewery/Beer": true
  Rugby: true
  Other: false
